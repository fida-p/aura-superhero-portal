# =====================================================
# AURA — Guardian of Voices | GitHub Pages deployment
#
# Builds the React/Vite frontend and publishes frontend/dist
# to GitHub Pages on every push to main.
#
# SECURITY: this workflow contains NO secrets. The only value
# injected here is the PUBLIC Render API URL (not a password,
# key, or credential — it is already visible in client-side JS).
# SMTP credentials are never referenced here.
#
# NOTE: the "deploy" job requires GitHub Pages to be enabled
# with Source = "GitHub Actions" (Settings → Pages). A run made
# BEFORE Pages was enabled fails with:
#   "Failed to create deployment (status: 404)".
# Re-running after enabling Pages resolves it.
# =====================================================

name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Avoid overlapping Pages deployments (recommended for Pages)
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_URL: https://aura-backend-djnb.onrender.com/api

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # NOTE: `working-directory` does NOT apply to `uses:` steps,
          # so this path is relative to the repo root — correct as-is.
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
