# =====================================================
# AURA — Guardian of Voices | Render Blueprint
# Defines the two deployable units of this monorepo.
#
# SECURITY: this file contains NO secrets. Keys marked
# `sync: false` prompt for a private value in the Render
# Dashboard on creation — enter real values there,
# never in git. NEVER commit backend/.env.
# =====================================================

services:
  # ---------- Backend: Node.js + Express API ----------
  - type: web
    name: aura-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    # Render injects PORT automatically; server.js already honors it.
    healthCheckPath: /api/health
    envVars:
      # Public frontend origin(s) for CORS, comma-separated.
      # For GitHub Pages set: https://fida-p.github.io
      # (Browsers send Origin WITHOUT any sub-path, so the bare
      #  origin is what must match. The backend normalizes any
      #  path/trailing-slash in this value automatically.)
      - key: FRONTEND_URL
        sync: false
      # Resend HTTP API key for help-request emails (port 443, works
      # on Render Free where outbound SMTP ports 25/465/587 are blocked).
      # Paste the key ONLY in the Dashboard (never in git).
      - key: RESEND_API_KEY
        sync: false
      # Sender identity. Free Resend accounts must use the test sender
      # until a domain is verified (MAIL_TO can still be any address).
      - key: MAIL_FROM
        value: "AURA Portal <onboarding@resend.dev>"
      - key: MAIL_TO
        sync: false

  # ---------- Frontend: React + Vite static site ----------
  - type: static
    name: aura-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      # Public URL of the deployed backend API. Set AFTER the backend
      # exists, e.g. https://aura-backend.onrender.com/api, then
      # manually redeploy/clear-build-cache this site so Vite bakes it in.
      - key: VITE_API_URL
        sync: false
